version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["abhaengigkeiten"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    labels: ["abhaengigkeiten", "container"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: ["abhaengigkeiten", "ci"]
