{% extends "basis.html" %}
{% set s = standort %}
{% block ueberschrift %}{{ "Standort bearbeiten" if s else "Neuer Standort" }}{% endblock %}

{% block inhalt %}
<form method="post" action="/standorte/speichern" class="card shadow-sm">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <input type="hidden" name="standort_id" value="{{ s.id if s else '' }}">
  <div class="card-body row g-3">
    <div class="col-md-4">
      <label class="form-label" for="mandant">Mandant *</label>
      <select class="form-select" id="mandant" name="mandant_id" required>
        {% for m in mandanten %}
        <option value="{{ m.id }}" {{ 'selected' if s and s.mandant_id == m.id }}>{{ m.anzeigename }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-5">
      <label class="form-label" for="name">Name *</label>
      <input class="form-control" id="name" name="name" required maxlength="120"
             value="{{ s.name if s else '' }}">
    </div>
    <div class="col-md-3">
      <label class="form-label" for="kurz">Kurzzeichen</label>
      <input class="form-control" id="kurz" name="kurzzeichen" maxlength="20"
             value="{{ s.kurzzeichen or '' if s else '' }}">
    </div>
    <div class="col-md-6">
      <label class="form-label" for="strasse">Strasse / Nr.</label>
      <input class="form-control" id="strasse" name="strasse" maxlength="160"
             value="{{ s.strasse or '' if s else '' }}">
    </div>
    <div class="col-md-2">
      <label class="form-label" for="plz">PLZ</label>
      <input class="form-control" id="plz" name="plz" maxlength="10" value="{{ s.plz or '' if s else '' }}">
    </div>
    <div class="col-md-4">
      <label class="form-label" for="ort">Ort</label>
      <input class="form-control" id="ort" name="ort" maxlength="120" value="{{ s.ort or '' if s else '' }}">
    </div>
    <div class="col-md-4">
      <label class="form-label" for="land">Land</label>
      <input class="form-control" id="land" name="land" maxlength="60"
             value="{{ s.land if s else 'Deutschland' }}">
    </div>
    <div class="col-md-4">
      <label class="form-label" for="ap">Ansprechpartner</label>
      <input class="form-control" id="ap" name="ansprechpartner" maxlength="120"
             value="{{ s.ansprechpartner or '' if s else '' }}">
    </div>
    <div class="col-md-4">
      <label class="form-label" for="tel">Telefon</label>
      <input class="form-control" id="tel" name="telefon" maxlength="60"
             value="{{ s.telefon or '' if s else '' }}">
    </div>
    <div class="col-12">
      <label class="form-label" for="notizen">Notizen</label>
      <textarea class="form-control" id="notizen" name="notizen" rows="3">{{ s.notizen or '' if s else '' }}</textarea>
    </div>
  </div>
  <div class="card-footer d-flex gap-2">
    <button class="btn btn-primary">Speichern</button>
    <a class="btn btn-outline-secondary" href="/standorte">Abbrechen</a>
  </div>
</form>
{% endblock %}
